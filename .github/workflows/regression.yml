name: JavaScript and warning print regression
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: regression-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/requirements-print.txt
      - run: npm ci
      - run: python -m pip install -r tests/requirements-print.txt
      - run: python -m playwright install --with-deps chromium
      - run: sudo apt-get install -y fonts-noto-cjk
      - run: npm test
      - run: npm run build
      - name: Publish report in job summary
        if: always()
        run: |
          if [ -f artifacts/warning-print/summary.md ]; then
            cat artifacts/warning-print/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: warning-print-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/warning-print/
          if-no-files-found: warn
          retention-days: 14
