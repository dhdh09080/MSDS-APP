<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#27272b"><title>현장 전체 협력사 리스트</title></head>
<body class="directory-page">
<header class="header"><div class="header-logo"><span class="portal-brand">GS</span> 보건 현장관리 시스템 <span class="portal-label">현장 공유 목록</span></div><h1 class="header-ws" id="directoryTitle">현장 전체 협력사 리스트</h1><p class="header-desc">서류 제출 현황과 협력사 연락처를 한곳에서 확인하세요.</p></header>
<main class="content">
<div id="directoryLoading" class="portal-empty" role="status">협력사 목록을 불러오는 중입니다…</div>
<div id="directoryError" class="directory-error" role="alert" hidden></div>
<section id="directoryContent" hidden>
<div class="portal-overview"><div><span class="eyebrow">SITE PARTNERS</span><h2>함께 만드는 안전한 현장</h2><p>협력사명을 누르면 해당 협력사의 자료 관리페이지로 이동합니다.</p></div><button id="directoryRegister" class="btn btn-primary">+ 협력사 등록하기</button></div>
<div class="portal-stats"><div><span>전체 협력사</span><strong id="directoryTotal">0</strong></div><div><span>등록증 제출</span><strong id="directoryLicenseTotal">0</strong></div><div><span>MSDS 제출</span><strong id="directoryMsdsTotal">0</strong></div></div>
<div class="portal-toolbar directory-toolbar"><input id="directorySearch" type="search" placeholder="협력사명, 관리자명, 전화번호 검색" aria-label="협력사 검색"><select id="directoryFilter" aria-label="제출 현황 필터"><option value="all">전체 협력사</option><option value="license">등록증 미제출</option><option value="msds">MSDS 미제출</option></select><button class="btn btn-secondary" id="directoryRefresh">새로고침</button></div>
<p id="directoryResultCount" class="directory-count" role="status"></p>
<div class="directory-table-wrap"><table class="directory-table"><thead><tr><th>협력사명</th><th>사업자등록증</th><th>MSDS</th><th>관리자명</th><th>전화번호</th><th>관리</th></tr></thead><tbody id="directoryList"></tbody></table></div>
<p class="directory-note">등록·수정한 정보는 현장관리 시스템에 함께 반영됩니다. 이 링크를 가진 현장 참여자는 연락처를 조회·수정할 수 있습니다.</p>
</section>
</main>
<dialog id="directoryDialog" class="directory-dialog"><form id="directoryForm"><div class="directory-dialog-heading"><h2 id="directoryFormTitle">협력사 등록하기</h2><button type="button" id="directoryCancel" class="btn btn-secondary" aria-label="닫기">✕</button></div><input id="directoryEditingId" type="hidden"><label>협력사명<input id="directoryName" maxlength="150" required autocomplete="organization"></label><label>협력사 관리자명<input id="directoryManager" maxlength="100" autocomplete="name" placeholder="예: 홍길동"></label><label>전화번호<input id="directoryPhone" type="tel" maxlength="30" autocomplete="tel" placeholder="예: 010-1234-5678"></label><p id="directoryFormError" role="alert"></p><button id="directorySave" class="btn btn-primary" type="submit">등록하기</button></form></dialog>
<div id="toastWrap" class="toast-wrap" role="status"></div>
<script>setTimeout(function(){if(!document.getElementById('directoryLoading').hidden){document.getElementById('directoryLoading').hidden=true;document.getElementById('directoryError').hidden=false;document.getElementById('directoryError').textContent='연결이 지연되고 있습니다. 네트워크를 확인한 후 페이지를 다시 열어주세요.';}},25000)</script>
<script type="module" src="/src/contractor-directory.js"></script>
</body></html>
